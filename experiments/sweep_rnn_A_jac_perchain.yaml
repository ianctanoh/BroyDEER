# Jacobian recovery: per-chain data, k=0, no line search
# Points: (50, 100k), (50, 200k), (200, 100k)
program: harness_rnn_jacobian.py
method: grid
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  alg:
    values:
      - broyden
      - accelerated_broyden
  N:
    values: [50]
  T:
    values: [100000, 200000]

  batch_size:
    value: 16
  dt:
    value: 3.0
  tau:
    value: 10.0
  g:
    value: 2.0
  R:
    value: 3
  bd_gamma:
    value: 0.7
  acc_gamma:
    value: 0.7
  bd_m:
    value: 3
  acc_m:
    value: 3
  bd_init:
    value: identity
  acc_init:
    value: identity
  bd_k:
    value: 0.0
  acc_k:
    value: 0.0
  acc_eps_gram:
    value: 0.000001
  acc_compress:
    value: rand
  deer_k:
    value: 0.0
