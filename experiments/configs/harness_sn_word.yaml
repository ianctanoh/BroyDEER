seed: 37
N: 5
T: 1000
num_iters: 300
tol: 1e-2
batch_size: 16
nwarmups: 3
nreps: 3
mode: "online"
alg: "deer"

# DEER / quasi-DEER specific
deer_k: 0.0

# Broyden-DEER specific
bd_m: 2
bd_init: "identity"
bd_k: 0.0
bd_gamma: 0.4
bd_compress: "rand"

# Accelerated Broyden specific
acc_m: 2
acc_init: "identity"
acc_k: 0.0
acc_eps_gram: 1e-6
acc_gamma: 0.4
acc_compress: "rand"

hydra:
  run:
    dir: .
  job:
    chdir: False
