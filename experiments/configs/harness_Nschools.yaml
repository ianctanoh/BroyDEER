seed: 13
S: 10
T: 10000
num_iters: 200
tol: 1e-2
batch_size: 16
nwarmups: 3
nreps: 3
mode: "online"
alg: "deer"

# DEER / quasi-DEER specific
deer_k: 0.0

# Broyden-DEER specific
bd_m: 3
bd_init: "identity"
bd_k: 0.5
bd_gamma: 0.

# Accelerated Broyden specific
acc_m: 2
acc_init: "identity"
acc_k: 0.2
acc_eps_gram: 1e-6
acc_gamma: 0.
acc_compress: "svd"

hydra:
  run:
    dir: .
  job:
    chdir: False
