seed: 13
S: 10
T: 10000
N_s: 20
tausq_0: 100.0
sigmasq_0: 10.0
num_iters: 200
tol: 1e-2
batch_size: 16
nwarmups: 3
nreps: 3
mode: "online"
alg: "deer"

# DEER / quasi-DEER specific
deer_k: 0.2
quasi_k: 0.0
num_samples: 1

# Broyden-DEER specific
bd_m: 2
bd_init: "identity"
bd_k: 0.3
bd_gamma: 0.
bd_line_search: false

# Accelerated Broyden specific
acc_m: 2
acc_init: "identity"
acc_k: 0.2
acc_eps_gram: 1e-6
acc_gamma: 0.
acc_compress: "low_rank_exact"
acc_line_search: true
acc_ls_c: 0.001

hydra:
  run:
    dir: .
  job:
    chdir: False
