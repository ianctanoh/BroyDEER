# N-schools sweep, tol=1e-3 (float32) -- matched float32 vs float64 ablation; all solvers stop on ||r||_2 / sqrt(T*D) < tol
# damping: k=0 for deer, k=0.2 for quasi, broyden and accelerated_broyden
command:
  - ${env}
  - JAX_PLATFORMS=cuda
  - JAX_ENABLE_X64=False
  - python
  - ${program}
  - ${args_no_hyphens}
method: grid
program: harness_Nschools.py
parameters:
  alg:
    values: ['seq', 'deer', 'quasi', 'jacobi', 'broyden', 'accelerated_broyden']
  S:
    values: [10, 50, 100]
  T:
    values: [1000, 10000, 50000, 100000]
  seed:
    value: 13
  N_s:
    value: 20
  batch_size:
    value: 32
  num_iters:
    value: 1000
  tol:
    value: 1e-3
  nwarmups:
    value: 3
  nreps:
    value: 3
  mode:
    value: "online"
  deer_k:
    value: 0.0
  quasi_k:
    value: 0.0
  bd_m:
    value: 2
  bd_init:
    value: "identity"
  bd_k:
    value: 0.3
  bd_gamma:
    value: 0.
  bd_line_search:
    value: false
  acc_m:
    value: 2
  acc_init:
    value: "identity"
  acc_k:
    value: 0.2
  acc_eps_gram:
    value: 1e-6
  acc_gamma:
    value: 0.
  acc_compress:
    value: "low_rank_exact"
  acc_ls_c:
    value: 0.001
  tausq_0:
    value: 100.0
  sigmasq_0:
    value: 10.0
project: broydeer
name: Nschools_deer0_k02_float32_tol1e-3
