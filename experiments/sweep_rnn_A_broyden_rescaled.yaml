# Sweep A: standard Broyden with rescaled_identity init
# Compare against identity init from the full runtime sweep
program: harness_rnn_single.py
method: grid
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  alg:
    values:
      - broyden
  N:
    values: [50, 100, 200]
  T:
    values: [10000, 100000, 200000]

  batch_size:
    value: 32
  dt:
    value: 3.0
  tau:
    value: 10.0
  g:
    value: 2.0
  R:
    value: 3
  bd_gamma:
    value: 0.7
  acc_gamma:
    value: 0.7
  bd_m:
    value: 3
  acc_m:
    value: 3
  bd_init:
    value: rescaled_identity
  acc_init:
    value: identity
  bd_k:
    value: 0.2
  acc_k:
    value: 0.2
  acc_eps_gram:
    value: 0.000001
  acc_compress:
    value: rand
  deer_k:
    value: 0.2
