# Sweep A: compression scheme comparison for accelerated broyden
# Same grid as runtime sweep but only accel, testing qr_svd and sequential_solve
program: harness_rnn_compress.py
method: grid
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  alg:
    values:
      - accelerated_broyden
  N:
    values: [50, 100]
  T:
    values: [10000, 100000, 200000]
  acc_compress:
    values:
      - rand
      - gs_svd
      - sequential

  batch_size:
    value: 16
  dt:
    value: 3.0
  tau:
    value: 10.0
  g:
    value: 2.0
  R:
    value: 3
  bd_gamma:
    value: 0.7
  acc_gamma:
    value: 0.7
  bd_m:
    value: 3
  acc_m:
    value: 3
  bd_init:
    value: identity
  acc_init:
    value: identity
  bd_k:
    value: 0.2
  acc_k:
    value: 0.2
  acc_eps_gram:
    value: 0.000001
  deer_k:
    value: 0.2
