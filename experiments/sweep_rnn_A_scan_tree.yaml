# Sweep: scan-tree topology comparison (Blelloch vs Hillis-Steele)
# Same grid as sweep_rnn_A_compress.yaml, but for broyden + accelerated_broyden,
# with acc_compress held fixed at "rand" and scan_tree swept instead.
program: harness_rnn_scan.py
method: grid
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  alg:
    values:
      - broyden
      - accelerated_broyden
  N:
    values: [50, 100]
  T:
    values: [1000, 5000, 10000]
  scan_tree:
    values:
      - blelloch
      - hillis_steele

  acc_compress:
    value: rand

  batch_size:
    value: 16
  dt:
    value: 3.0
  tau:
    value: 10.0
  g:
    value: 2.0
  R:
    value: 3
  bd_gamma:
    value: 0.7
  acc_gamma:
    value: 0.7
  bd_m:
    value: 3
  acc_m:
    value: 3
  bd_init:
    value: identity
  acc_init:
    value: identity
  bd_k:
    value: 0.2
  acc_k:
    value: 0.2
  acc_eps_gram:
    value: 0.000001
  deer_k:
    value: 0.2
